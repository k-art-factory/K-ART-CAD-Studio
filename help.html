<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K-ART CAD Studio HELP</title><style>body{font:16px/1.75 system-ui,"Noto Sans JP",sans-serif;background:#f5f7fa;color:#1e293b;margin:0}header{background:#202b39;color:white;padding:26px max(20px,calc((100vw - 900px)/2))}main{max-width:900px;margin:auto;padding:25px}nav{display:flex;flex-wrap:wrap;gap:10px}nav a{padding:7px 12px;background:#dce9f5;border-radius:6px}section{background:white;padding:18px 25px;border-radius:10px;margin:18px 0;box-shadow:0 2px 8px #0001}h2{border-bottom:1px solid #ddd;padding-bottom:6px}a{color:#15639b}footer{text-align:center;padding:30px}code{background:#eef2f6;padding:2px 5px;border-radius:4px}li{margin:5px 0}</style></head><body><header><h1>K-ART CAD Studio — HELP</h1><p id="intro">初めての方にも使いやすい2D CADの操作ガイド</p><label>Language / 言語 <select id="lang"><option value="ja">日本語</option><option value="en">English</option></select></label></header><main><nav id="toc"></nav><div id="sections"></div></main><footer><strong>Powered by K-ART FACTORY</strong><p><a href="https://www.k-art-factory.com/" target="_blank" rel="noopener">https://www.k-art-factory.com/</a></p><p><a href="https://www.k-art-factory.biz/" target="_blank" rel="noopener">K-ART Portal — https://www.k-art-factory.biz/</a></p></footer><script>const data={ja:[['はじめてのCAD','最初の操作',['「直線 (L)」を選び、キャンバス上で始点と終点をクリックします。','「選択・移動 (V)」で図形をクリックし、ドラッグすると移動できます。','ホイールで拡大縮小、中ボタンドラッグで画面移動。迷子になったら「全体表示」または「ホームへ」を使います。']],['作図ツール','基本図形',['直線 (L)：2点を指定。長方形 (R)：対角の2点を指定。円 (C)：中心と半径位置を指定。','円弧 (A)：始点、通過点、終点を指定。','文字 (N)：右側で文字と高さを設定し、配置位置をクリックします。','右側の「数値作図」でmm単位の座標や寸法を指定できます。']],['編集ツール','図形の加工',['トリム (T)：編集する線と境界線を順にクリック。','延長 (E)：延ばす線と境界線を順にクリック。','オフセット (O)：左側で距離を設定し、元の線と複製側をクリック。','面取り (F)：距離を設定し、交差する2本の線をクリック。','選択した図形はDeleteで削除、Ctrl+Zで元に戻せます。']],['寸法と測定','mmで確認',['寸法線 (D)：2点をクリックして寸法を作成。','距離測定 (Q)：開始点と終了点をクリック。右側に距離・ΔX・ΔYを表示します。','端点・中点・中心の図形スナップ、グリッドスナップを左側で切り替えられます。']],['複数選択と数値編集','複数選択と編集',['選択ツールでShiftを押しながらクリックすると複数選択できます。','「グループ化」すると一緒に選択・移動できます。グループ解除も可能です。','右側のΔX・ΔYを入力し「数値で移動」または「数値でコピー」。','図形を1個選択すると、右側で座標、線の長さ、円の半径などを編集できます。']],['ファイルとバックアップ','データを安全に扱う',['「ファイル」から新規・開く・保存・別名保存を操作。保存形式はJSONです。','SVG・PNG出力、DXF出力・読込にも対応しますが、DXFは一部の図形に限ります。','自動バックアップはブラウザ内に保存します。復元は右側の「バックアップを復元」から。','重要な図面は必ずJSONでも保存してください。ブラウザのデータ削除やプライベートモードではバックアップが失われることがあります。']],['印刷と縮尺','紙に正しく出す',['「プリント」から印刷・印刷プレビューを開きます。','右側で用紙A4〜A0、向き、縮尺1:n、図面枠、表題欄を設定。','ブラウザ印刷は倍率100%、余白なし、ヘッダー・フッターなしを推奨。実寸は定規で確認してください。']],['ショートカット','操作一覧',['V：選択・移動 ／ L：直線 ／ R：長方形 ／ C：円 ／ A：円弧 ／ N：文字','D：寸法 ／ Q：距離測定 ／ T：トリム ／ E：延長 ／ O：オフセット ／ F：面取り','H：手のひら（画面移動） ／ Delete：選択図形の削除 ／ Esc：操作キャンセル','Ctrl+Z：元に戻す ／ Ctrl+Y・Ctrl+Shift+Z：やり直す ／ Ctrl+S：保存','Shift＋クリック：複数選択 ／ 図形をダブルクリック：プロパティ編集','Ctrl+C：コピー ／ Ctrl+V：貼り付け（10mmずらす） ／ Ctrl+O：開く ／ Ctrl+N：新規 ／ Ctrl+P：印刷','Ctrl+A：すべて選択 ／ Home：ホームへ ／ F1：HELP','Ctrl+G：グループ化 ／ Ctrl+Shift+G：グループ解除']]],en:[['Getting started','First steps',['Choose Line (L), then click the start and end points.','Choose Select (V), click a shape and drag to move it.','Mouse wheel zooms; middle-button drag pans. Use Fit or Home if you lose your place.']],['Drawing tools','Create shapes',['Line (L): two points. Rectangle (R): opposite corners. Circle (C): center and radius point.','Arc (A): start, point on arc, end. Text (N): set text properties and click to place.','Numeric Drawing lets you specify coordinates and sizes in millimeters.']],['Editing','Modify shapes',['Trim (T) and Extend (E): choose the target line and then the boundary.','Offset (O): set distance, choose line and side. Chamfer (F): choose two intersecting lines.','Delete removes selected shapes. Ctrl+Z undoes changes.']],['Dimensions and measuring','Millimeters',['Dimension (D): click two points. Measure (Q): click two points and see distance, ΔX and ΔY.','Toggle object snap and grid snap in the left panel.']],['Multi-select and numeric edits','Selection and editing',['Shift+click to select multiple shapes. Group and Ungroup in the left panel.','Enter ΔX/ΔY in the right panel to Move or Copy.','Select one shape to edit coordinates, line length or circle radius in Properties.']],['Files and recovery','Keep your work',['File menu: New, Open, Save, Save As; native drawings use JSON.','SVG, PNG and limited DXF import/export are available.','Automatic backup stays in this browser. Use Restore Backup in the right panel.','Save important drawings to JSON as browser storage can be cleared or unavailable.']],['Printing and scale','Paper output',['Print menu opens Print and Print Preview.','Set A4–A0, orientation, scale 1:n, frame and title block in the right panel.','Use browser print scale 100%, no margins, no headers/footers; verify physical measurements with a ruler.']],['Keyboard shortcuts','Quick reference',['V Select / L Line / R Rectangle / C Circle / A Arc / N Text','D Dimension / Q Measure / T Trim / E Extend / O Offset / F Chamfer','H: Pan / Delete: Delete selected / Esc: Cancel','Ctrl+Z: Undo / Ctrl+Y or Ctrl+Shift+Z: Redo / Ctrl+S: Save','Shift+click: Multi-select / Double-click a shape: Edit properties','Ctrl+C: Copy / Ctrl+V: Paste (+10mm X/Y) / Ctrl+O: Open / Ctrl+N: New / Ctrl+P: Print','Ctrl+A: Select all / Home: Go Home / F1: HELP','Ctrl+G: Group / Ctrl+Shift+G: Ungroup']]]};function render(lang){document.documentElement.lang=lang;document.querySelector('#intro').textContent=lang==='ja'?'初めての方にも使いやすい2D CADの操作ガイド':'Beginner-friendly 2D CAD guide';document.querySelector('#toc').replaceChildren();document.querySelector('#sections').replaceChildren();data[lang].forEach(([title,sub,items],i)=>{const a=document.createElement('a');a.href='#s'+i;a.textContent=title;document.querySelector('#toc').append(a);const s=document.createElement('section');s.id='s'+i;const h=document.createElement('h2');h.textContent=title;const p=document.createElement('p');p.textContent=sub;const ul=document.createElement('ul');items.forEach(item=>{const li=document.createElement('li');li.textContent=item;ul.append(li)});s.append(h,p,ul);document.querySelector('#sections').append(s)})}const preferred=localStorage.getItem('kartcad.language.v1')==='en'?'en':'ja';document.querySelector('#lang').value=preferred;document.querySelector('#lang').onchange=e=>render(e.target.value);render(preferred);</script></body></html>
